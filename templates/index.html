<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Entry Form</title>
</head>
<body>
    <h1>Data Entry Form</h1>
    <form action="{{url_for('predict')}}" method="post">
        <label for="temperature">Temperature:</label>
        <input type="number" id="temperature" name="Temperature" required><br><br>

        <label for="rh">RH:</label>
        <input type="number" id="rh" name="RH" required><br><br>

        <label for="ws">Ws:</label>
        <input type="number" id="ws" name="Ws" required><br><br>

        <label for="rain">Rain:</label>
        <input type="number" id="rain" name="Rain" step="any" required><br><br>

        <label for="ffmc">FFMC:</label>
        <input type="number" id="ffmc" name="FFMC" step="any" required><br><br>

        <label for="dmc">DMC:</label>
        <input type="number" id="dmc" name="DMC" step="any" required><br><br>

        <label for="isi">ISI:</label>
        <input type="number" id="isi" name="ISI" step="any" required><br><br>

        <label for="classes">Classes:</label>
        <input type="text" id="classes" name="Classes" required><br><br>

        <label for="region">Region:</label>
        <input type="text" id="region" name="Region" required><br><br>

        <input type="submit" value="Predict">
    </form>
    <h2>
        The FWI prediction is {{results}}
        </h2>
</body>
</html>
